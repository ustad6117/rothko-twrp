name: Build Rothko TWRP v28 FINAL - split stock 3.0.301 hybrid
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Configure memory for Soong graph generation
        run: |
          set -eo pipefail
          # TWRP 16 builders that run on GitHub-hosted runners use zram because
          # soong_build graph generation can consume nearly all physical RAM.
          sudo swapoff -a || true
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" zram-tools
          sudo modprobe zram
          sudo sed -i 's/^#\?PERCENT=.*/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#\?PRIORITY=.*/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          # Keep a lower-priority disk swap behind zram as a safety net.
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          echo '=== memory configuration ==='
          free -h
          zramctl || true
          swapon --show --bytes || true

      - name: Restore TWRP16 compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: rothko-twrp16-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rothko-twrp16-ccache-${{ runner.os }}-

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 lzop pngcrush repo rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Sync native TWRP 16 source and rothko tree
        run: |
          set -exo pipefail
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git -b twrp-16.0
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j2
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/rothko
          git clone --depth=1 -b twrp-14.1_a16 https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp.git device/xiaomi/rothko
          repo manifest -r > "$GITHUB_WORKSPACE/manifest.xml"
          echo "recovery_head=$(git -C bootable/recovery rev-parse HEAD)"
          echo "rothko_head=$(git -C device/xiaomi/rothko rev-parse HEAD)"
          # Header v4: build recovery resources as their own RECOVERY-type vendor ramdisk.
          # This is required so we can transplant only TWRP into the known-good stock vendor_boot.
          if grep -q '^BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT[[:space:]]*:=' device/xiaomi/rothko/BoardConfig.mk; then
            sed -i 's/^BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT[[:space:]]*:=.*/BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true/' device/xiaomi/rothko/BoardConfig.mk
          else
            printf '\nBOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true\n' >> device/xiaomi/rothko/BoardConfig.mk
          fi
          grep -n 'BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT' device/xiaomi/rothko/BoardConfig.mk
          # Final size cut with no functional recovery feature removed: English UI only.
          sed -i 's/^TW_EXTRA_LANGUAGES[[:space:]]*:=.*/TW_EXTRA_LANGUAGES := false/' device/xiaomi/rothko/BoardConfig.mk
          sed -i 's/^TW_DEFAULT_LANGUAGE[[:space:]]*:=.*/TW_DEFAULT_LANGUAGE := en/' device/xiaomi/rothko/BoardConfig.mk
          grep -nE 'TW_EXTRA_LANGUAGES|TW_DEFAULT_LANGUAGE|TW_INCLUDE_CRYPTO|TW_INCLUDE_CRYPTO_FBE|TW_INCLUDE_FASTBOOTD|TW_LOAD_VENDOR_BOOT_MODULES' device/xiaomi/rothko/BoardConfig.mk

      - name: Verify rothko vendor_boot contract
        run: |
          set -exo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          grep -q 'TARGET_NO_RECOVERY.*true' device/xiaomi/rothko/BoardConfig.mk
          grep -q 'BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT.*true' device/xiaomi/rothko/BoardConfig.mk
          grep -q 'BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT.*true' device/xiaomi/rothko/BoardConfig.mk
          grep -q 'BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE.*67108864' device/xiaomi/rothko/BoardConfig.mk
          grep -q 'TW_INCLUDE_CRYPTO.*true' device/xiaomi/rothko/BoardConfig.mk
          grep -q 'TW_INCLUDE_CRYPTO_FBE.*true' device/xiaomi/rothko/BoardConfig.mk
          echo 'rothko_vendor_boot_contract=PASS'

      - name: Build TWRP with live memory telemetry
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true USE_CCACHE=1 CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=4G OUT_DIR=out
          export GOMAXPROCS=1 NINJA_ARGS="-j1" SOONG_UI_NINJA_ARGS="-j1"
          ccache -M 4G || true
          source build/envsetup.sh
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          lunch twrp_rothko bp2a eng
          test "${TARGET_PRODUCT:-}" = twrp_rothko
          test "${TARGET_RELEASE:-}" = bp2a
          test "${TARGET_BUILD_VARIANT:-}" = eng
          echo 'release_environment_check=PASS'
          # Emit telemetry into the live Actions log. If the runner kills the job,
          # the last sample remains visible even though later artifact steps cannot run.
          (while true; do
             echo "=== MEM $(date -u +%H:%M:%S) ==="
             free -h
             swapon --show || true
             zramctl || true
             sleep 10
           done) &
          MON_PID=$!
          trap 'kill $MON_PID 2>/dev/null || true' EXIT
          set +e
          m vendorbootimage -j1
          BUILD_RC=$?
          set -e
          FRAG="$GITHUB_WORKSPACE/twrp/out/target/product/rothko/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4"
          test -s "$FRAG"
          echo "container_build_rc=$BUILD_RC (nonfatal; recovery fragment exists)"
          kill $MON_PID 2>/dev/null || true
          trap - EXIT

      - name: Validate builder container (superseded by final hybrid validator)
        if: false
        run: |
          set -exo pipefail
          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/rothko/vendor_boot.img"
          test -s "$OUT"
          SIZE=$(stat -c%s "$OUT")
          echo "vendor_boot_size=$SIZE" | tee "$GITHUB_WORKSPACE/vendor_boot-validation.txt"
          echo "partition_limit=67108864" | tee -a "$GITHUB_WORKSPACE/vendor_boot-validation.txt"
          if [ "$SIZE" -gt 67108864 ]; then
            echo 'size_check=FAIL' | tee -a "$GITHUB_WORKSPACE/vendor_boot-validation.txt"
            exit 1
          fi
          echo 'size_check=PASS' | tee -a "$GITHUB_WORKSPACE/vendor_boot-validation.txt"
          sha256sum "$OUT" | tee "$GITHUB_WORKSPACE/vendor_boot.sha256"

      - name: Build FINAL stock-3.0.301 hybrid vendor_boot
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          STOCK="$GITHUB_WORKSPACE/finalwork/stock_vendor_boot.img"
          PARTS="$GITHUB_WORKSPACE/stock_parts"
          EXPECTED_STOCK_SHA="7ef19af2b40b21e5b43339cb7260c5ed4db622faadd0554637ee23077fdbd673"
          # GitHub web upload rejects files over 25 MiB, so the verified 64 MiB stock
          # vendor_boot is stored as four 16 MiB byte-exact chunks and reconstructed here.
          test -s "$PARTS/stock_vendor_boot.img.part00"
          test -s "$PARTS/stock_vendor_boot.img.part01"
          test -s "$PARTS/stock_vendor_boot.img.part02"
          test -s "$PARTS/stock_vendor_boot.img.part03"
          test "$(find "$PARTS" -maxdepth 1 -type f -name 'stock_vendor_boot.img.part*' | wc -l)" -eq 4
          mkdir -p "$GITHUB_WORKSPACE/finalwork"
          cat "$PARTS/stock_vendor_boot.img.part00" \
              "$PARTS/stock_vendor_boot.img.part01" \
              "$PARTS/stock_vendor_boot.img.part02" \
              "$PARTS/stock_vendor_boot.img.part03" > "$STOCK"
          test "$(stat -c%s "$STOCK")" -eq 67108864
          echo "$EXPECTED_STOCK_SHA  $STOCK" | sha256sum -c -
          echo 'stock_reassembly=PASS'
          WORK="$GITHUB_WORKSPACE/finalwork"
          rm -rf "$WORK" && mkdir -p "$WORK/stockroot" "$WORK/twrproot" "$WORK/slimplat"
          # Extract the exact stock PLATFORM fragment (entry 0) from OS3.0.301 vendor_boot.
          python3 - "$STOCK" "$WORK/stock-platform.cpio.lz4" <<'PY'
          import struct,sys
          d=open(sys.argv[1],'rb').read(); assert d[:8]==b'VNDRBOOT'
          ver,page,_,_,vrsz=struct.unpack_from('<5I',d,8); assert ver==4 and page==4096
          o=28+2048+4+16
          hs,ds=struct.unpack_from('<II',d,o); o+=8; o+=8
          ts,en,es,bs=struct.unpack_from('<4I',d,o); assert en==2 and es==108
          al=lambda x:(x+page-1)//page*page
          vroff=page; dtoff=vroff+al(vrsz); toff=dtoff+al(ds)
          sz,off,typ=struct.unpack_from('<III',d,toff)
          assert typ==1
          p=d[vroff+off:vroff+off+sz]; assert p[:4]==b'\x02\x21\x4c\x18'
          open(sys.argv[2],'wb').write(p)
          print('stock_platform_size=',len(p))
          PY
          lz4 -d "$WORK/stock-platform.cpio.lz4" "$WORK/stock-platform.cpio"
          (cd "$WORK/stockroot" && cpio -idm --no-absolute-filenames < "$WORK/stock-platform.cpio")
          TWRP_FRAG="$GITHUB_WORKSPACE/twrp/out/target/product/rothko/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4"
          test -s "$TWRP_FRAG"
          lz4 -d "$TWRP_FRAG" "$WORK/twrp-recovery.cpio"
          (cd "$WORK/twrproot" && cpio -idm --no-absolute-filenames < "$WORK/twrp-recovery.cpio")
          # Turn the full TWRP recovery root into an ABI-safe overlay on the stock PLATFORM.
          python3 "$GITHUB_WORKSPACE/scripts/make_delta.py" "$WORK/stockroot" "$WORK/twrproot" | tee "$GITHUB_WORKSPACE/delta-report.txt"
          # Any stock PLATFORM regular file supplied by the TWRP overlay would be dead duplicate bytes.
          cp -a "$WORK/stockroot/." "$WORK/slimplat/"
          python3 - "$WORK/slimplat" "$WORK/twrproot" <<'PY'
          import os,stat,sys
          plat,rec=sys.argv[1:]; n=b=0
          for base,dirs,files in os.walk(rec):
            for f in files:
              r=os.path.join(base,f); rel=os.path.relpath(r,rec); p=os.path.join(plat,rel)
              try: sr=os.lstat(r); sp=os.lstat(p)
              except OSError: continue
              if stat.S_ISREG(sr.st_mode) and stat.S_ISREG(sp.st_mode):
                os.remove(p); n+=1; b+=sp.st_size
          print(f'stock_dead_duplicates_removed={n}')
          print(f'stock_dead_duplicate_bytes_removed={b}')
          PY
          # Repack both fragments deterministically as legacy LZ4 HC, matching stock compression.
          (cd "$WORK/twrproot" && find . -print0 | LC_ALL=C sort -z | cpio --null -o -H newc --owner=0:0 > "$WORK/twrp-delta.cpio")
          (cd "$WORK/slimplat" && find . -print0 | LC_ALL=C sort -z | cpio --null -o -H newc --owner=0:0 > "$WORK/stock-platform-slim.cpio")
          lz4 -l -12 -f "$WORK/twrp-delta.cpio" "$WORK/twrp-delta.cpio.lz4"
          lz4 -l -12 -f "$WORK/stock-platform-slim.cpio" "$WORK/stock-platform-slim.cpio.lz4"
          echo "slim_platform=$(stat -c%s "$WORK/stock-platform-slim.cpio.lz4")" | tee "$GITHUB_WORKSPACE/final-sizes.txt"
          echo "twrp_delta=$(stat -c%s "$WORK/twrp-delta.cpio.lz4")" | tee -a "$GITHUB_WORKSPACE/final-sizes.txt"
          # Rebuild header-v4 container using stock header/cmdline/DTB/table metadata.
          python3 "$GITHUB_WORKSPACE/scripts/vendorboot_pack.py" "$STOCK" "$WORK/stock-platform-slim.cpio.lz4" "$WORK/twrp-delta.cpio.lz4" "$WORK/vendor_boot_final.img" | tee -a "$GITHUB_WORKSPACE/final-sizes.txt"
          PRE=$(stat -c%s "$WORK/vendor_boot_final.img")
          test "$PRE" -lt 67000000
          # Add a fresh unsigned AVB hash footer for the modified vendor_boot payload.
          AVB="$GITHUB_WORKSPACE/twrp/out/host/linux-x86/bin/avbtool"
          test -x "$AVB"
          "$AVB" add_hash_footer --image "$WORK/vendor_boot_final.img" --partition_size 67108864 --partition_name vendor_boot
          test "$(stat -c%s "$WORK/vendor_boot_final.img")" -eq 67108864
          "$AVB" verify_image --image "$WORK/vendor_boot_final.img"
          "$AVB" info_image --image "$WORK/vendor_boot_final.img" | tee "$GITHUB_WORKSPACE/avb-info.txt"
          sha256sum "$WORK/vendor_boot_final.img" | tee "$GITHUB_WORKSPACE/vendor_boot_final.sha256"
          # Structural invariants: v4, two fragments, PLATFORM then RECOVERY, stock DTB and stock cmdline.
          python3 - "$STOCK" "$WORK/vendor_boot_final.img" <<'PY'
          import hashlib,struct,sys
          def parse(p):
            d=open(p,'rb').read(); assert d[:8]==b'VNDRBOOT'
            ver,page,ka,ra,vrs=struct.unpack_from('<5I',d,8); assert ver==4 and page==4096
            cmd=d[28:28+2048]; o=28+2048+4+16
            hs,ds=struct.unpack_from('<II',d,o);o+=8;da=struct.unpack_from('<Q',d,o)[0];o+=8
            ts,en,es,bs=struct.unpack_from('<4I',d,o); al=lambda x:(x+page-1)//page*page
            vr=page; dt=vr+al(vrs); tab=dt+al(ds); ents=[]
            for i in range(en):
              e=tab+i*es; sz,off,typ=struct.unpack_from('<III',d,e); name=d[e+12:e+44].split(b'\0',1)[0]
              payload=d[vr+off:vr+off+sz]; ents.append((sz,typ,name,payload))
            return cmd,d[dt:dt+ds],ents
          sc,sd,se=parse(sys.argv[1]); fc,fd,fe=parse(sys.argv[2])
          assert fc==sc, 'cmdline changed from stock'
          assert fd==sd, 'DTB changed from stock'
          assert len(fe)==2 and fe[0][1]==1 and fe[1][1]==2 and fe[1][2]==b'recovery'
          assert all(x[3][:4]==b'\x02\x21\x4c\x18' for x in fe)
          print('FINAL_STRUCTURE=PASS')
          print('stock_dtb_sha256='+hashlib.sha256(sd).hexdigest())
          print('platform_size='+str(fe[0][0]))
          print('recovery_size='+str(fe[1][0]))
          PY
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$WORK/vendor_boot_final.img" "$GITHUB_WORKSPACE/artifacts/"
          cp "$WORK/twrp-delta.cpio.lz4" "$GITHUB_WORKSPACE/artifacts/"
          cp "$WORK/stock-platform-slim.cpio.lz4" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/final-sizes.txt" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/delta-report.txt" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/avb-info.txt" "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE/vendor_boot_final.sha256" "$GITHUB_WORKSPACE/artifacts/"

      - name: Collect
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for f in build.log manifest.xml vendor_boot-validation.txt vendor_boot.sha256; do
            cp "$GITHUB_WORKSPACE/$f" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          done
          free -h > "$GITHUB_WORKSPACE/artifacts/memory.txt"
          swapon --show > "$GITHUB_WORKSPACE/artifacts/swap.txt" || true
          df -h > "$GITHUB_WORKSPACE/artifacts/disk.txt"
          CCACHE_DIR="$HOME/.cache/ccache" ccache -s > "$GITHUB_WORKSPACE/artifacts/ccache-stats.txt" 2>&1 || true
          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/rothko"
          if [ -s "$OUT/vendor_boot.img" ]; then
            cp "$OUT/vendor_boot.img" "$GITHUB_WORKSPACE/artifacts/"
          fi
          find "$OUT" -maxdepth 8 -type f \( -name 'vendor_boot.img' -o -name '*ramdisk*' -o -name '*.cpio' -o -name '*.lz4' \) -print > "$GITHUB_WORKSPACE/artifacts/output-files.txt" 2>/dev/null || true
          find "$OUT" -maxdepth 8 -type f \( -name '*recovery*.cpio*' -o -name '*vendor_ramdisk_recovery*' \) -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \; 2>/dev/null || true

      - name: Free build output before cache save
        if: always()
        run: |
          df -h /
          rm -rf "$GITHUB_WORKSPACE/twrp/out"
          sudo rm -f /swapfile || true
          df -h /

      - name: Save TWRP16 compiler cache even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: rothko-twrp16-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rothko-twrp-build-v28-final
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
