name: Build Rothko TWRP v16
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      - name: Restore Repo object cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: twrp/.repo
          key: rothko-twrp14.1-repo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rothko-twrp14.1-repo-${{ runner.os }}-

      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: rothko-twrp14.1-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rothko-twrp14.1-ccache-${{ runner.os }}-

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lz4 lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          echo "source_cache_hit=${{ steps.source-cache.outputs.cache-hit }}"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j2
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/rothko
          git clone --depth=1 -b twrp-14.1_a16 https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp.git device/xiaomi/rothko

          echo "=== Import verified Android 16 TWRP partition.cpp baseline ==="
          # Use the recovery-framework partition implementation from an Android 16
          # TWRP tree that is actively built for API 36 devices.  Import ONLY
          # partition.cpp: do not import Qualcomm vold/Weaver/KeyMint or any
          # device-specific files into rothko (MediaTek).
          rm -rf "$GITHUB_WORKSPACE/a16-twrp-reference"
          git clone --depth=1 https://github.com/MissMyTime/twrp_device_sm8850.git "$GITHUB_WORKSPACE/a16-twrp-reference"
          REF="$GITHUB_WORKSPACE/a16-twrp-reference/patches/common/files/bootable/recovery/partition.cpp"
          test -s "$REF"
          test -s bootable/recovery/partition.cpp
          cp -f bootable/recovery/partition.cpp "$GITHUB_WORKSPACE/partition.cpp.upstream"
          cp -f "$REF" bootable/recovery/partition.cpp
          echo "reference_partition_sha256=$(sha256sum "$REF" | awk '{print $1}')"
          echo "installed_partition_sha256=$(sha256sum bootable/recovery/partition.cpp | awk '{print $1}')"
          cmp -s "$REF" bootable/recovery/partition.cpp

          # v13 failed on four *active* legacy-FDE calls.  The maintained A16
          # reference intentionally keeps those old call sites as // comments.
          # v15 incorrectly searched raw text and therefore rejected comments.
          # Strip C/C++ comments first and reject only executable occurrences.
          python3 - <<'PYA16'
          from pathlib import Path
          import re
          p = Path("bootable/recovery/partition.cpp")
          data = p.read_text(errors="surrogateescape")
          # Remove block comments, then // comments. This is sufficient for these
          # identifier call sites and avoids treating the reference's commented
          # legacy FDE code as executable C++.
          active = re.sub(r'/\*.*?\*/', '', data, flags=re.S)
          active = re.sub(r'//.*', '', active)
          stale = [
              "set_partition_data(",
              "cryptfs_check_footer(",
              "cryptfs_get_password_type(",
              "delete_crypto_blk_dev(",
          ]
          raw_found = [x for x in stale if x in data]
          active_found = [x for x in stale if x in active]
          print("legacy_fde_tokens_raw=" + (", ".join(raw_found) if raw_found else "<none>"))
          print("legacy_fde_calls_active=" + (", ".join(active_found) if active_found else "<none>"))
          if active_found:
              raise SystemExit("ERROR: Android 16 reference has ACTIVE legacy FDE calls")
          PYA16

      - name: Patch exact generated dependency
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/twrp"

          # The source Android.mk/Android.bp patch in v5 was not enough:
          # the final generated Ninja graph still asks libtar for
          # android.security.apc-ndk_platform.so.toc.
          #
          # First keep the safe source-level module-token migration.
          python3 - <<'PY'
          from pathlib import Path
          import re
          token=re.compile(r'"([A-Za-z0-9_.@+-]+)-ndk_platform"')
          changed=[]
          for p in Path(".").rglob("*"):
              if not p.is_file(): continue
              if ".repo" in p.parts or "out" in p.parts: continue
              if len(p.parts)>=2 and p.parts[0]=="prebuilts" and p.parts[1]=="vndk": continue
              if p.name not in ("Android.bp","Android.mk") and p.suffix not in (".bp",".mk"): continue
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              n,c=token.subn(lambda m:f'"{m.group(1)}-ndk"',s)
              if c:
                  p.write_text(n)
                  changed.append((str(p),c))
          Path("../source-module-patches.txt").write_text(
              "\n".join(f"{c}\t{p}" for p,c in changed)+("\n" if changed else "NO MATCHES\n"))
          PY

          # Verify we did not corrupt legitimate v31 filesystem paths.
          grep -q 'android.hardware.common-V2-ndk_platform-source/gen/include' prebuilts/vndk/v31/arm64/Android.bp
          grep -q 'android.hardware.graphics.common-V2-ndk_platform-source/gen/include' prebuilts/vndk/v31/arm64/Android.bp

      - name: Generate graph, repair stale NDK-platform TOC edges, and run Ninja
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 4G || true
          ccache -z || true
          echo "ccache_cache_hit=${{ steps.ccache-cache.outputs.cache-hit }}"

          source build/envsetup.sh
          lunch twrp_rothko-ap2a-eng

          # Generate Soong/Kati graph only. We must patch the generated graph
          # before Ninja executes it.
          build/soong/soong_ui.bash --make-mode --skip-ninja vendorbootimage

          echo "=== Resolve actual combined Ninja file ==="
          KATI_SUFFIX=""
          if [ -f out/last_kati_suffix ]; then
            KATI_SUFFIX="$(cat out/last_kati_suffix)"
          fi
          COMBINED="out/combined${KATI_SUFFIX}.ninja"

          if [ ! -f "$COMBINED" ]; then
            echo "ERROR: expected combined graph not found: $COMBINED"
            find out -maxdepth 1 -type f -name '*.ninja' -printf '%p\n' | sort
            exit 41
          fi
          echo "combined_ninja=$COMBINED" | tee "$GITHUB_WORKSPACE/ninja-entrypoint.txt"

          # v8 proved the stale edges are emitted by legacy Make into
          # out/build${KATI_SUFFIX}.ninja. Repair ONLY stale shared-library
          # .so.toc dependency paths of this exact form:
          #
          # SHARED_LIBRARIES/<module>-ndk_platform_intermediates/
          # <module>-ndk_platform.so.toc
          #
          # This deliberately does NOT replace arbitrary "-ndk_platform"
          # strings, and therefore cannot rewrite VNDK generated-header
          # source paths such as "...-ndk_platform-source/...".
          BUILD_NINJA="out/build${KATI_SUFFIX}.ninja"
          test -f "$BUILD_NINJA"

          echo "=== Scan exact stale NDK-platform TOC dependency pattern ==="
          python3 - "$BUILD_NINJA" "$GITHUB_WORKSPACE/generated-ndk-platform-edges.txt" <<'PY'
          import re, sys
          from pathlib import Path

          p = Path(sys.argv[1])
          report = Path(sys.argv[2])
          data = p.read_text(errors="surrogateescape")

          pat = re.compile(
              r"SHARED_LIBRARIES/"
              r"(?P<mod>[A-Za-z0-9_.@+\-]+)-ndk_platform_intermediates/"
              r"(?P=mod)-ndk_platform\.so\.toc"
          )

          matches = list(pat.finditer(data))
          mods = sorted({m.group("mod") for m in matches})

          report.write_text(
              "\n".join(f"{m}\t{sum(1 for x in matches if x.group('mod') == m)}"
                        for m in mods) + ("\n" if mods else "")
          )

          print(f"stale_ndk_platform_toc_edges_before={len(matches)}")
          print("modules=" + (", ".join(mods) if mods else "<none>"))

          if not matches:
              raise SystemExit("ERROR: no stale -ndk_platform .so.toc edges found; refusing broad patch")

          def repl(m):
              mod = m.group("mod")
              return (
                  f"SHARED_LIBRARIES/{mod}-ndk_intermediates/"
                  f"{mod}-ndk.so.toc"
              )

          patched, n = pat.subn(repl, data)
          p.write_text(patched, errors="surrogateescape")

          remaining = list(pat.finditer(patched))
          print(f"stale_ndk_platform_toc_edges_after={len(remaining)}")
          if remaining:
              raise SystemExit("ERROR: stale TOC edges remain after patch")

          # Guard against repeating the v4 mistake.
          protected = (
              "android.hardware.common-V2-ndk_platform-source/gen/include",
              "android.hardware.graphics.common-V2-ndk_platform-source/gen/include",
          )
          # These protected paths may or may not occur in this particular Ninja file.
          # If present, they must remain literally unchanged.
          for x in protected:
              before = data.count(x)
              after = patched.count(x)
              if before != after:
                  raise SystemExit(f"ERROR: protected VNDK path changed: {x}")
              print(f"protected_path_unchanged {x}: {after}")
          PY

          # Confirm both failures already observed are gone from the generated graph.
          echo "=== Verify known APC + keystore2 stale edges are gone ==="
          if grep -F -q \
            'SHARED_LIBRARIES/android.security.apc-ndk_platform_intermediates/android.security.apc-ndk_platform.so.toc' \
            "$BUILD_NINJA"; then
            echo "ERROR: APC stale edge remains"
            exit 42
          fi
          if grep -F -q \
            'SHARED_LIBRARIES/android.system.keystore2-V1-ndk_platform_intermediates/android.system.keystore2-V1-ndk_platform.so.toc' \
            "$BUILD_NINJA"; then
            echo "ERROR: keystore2 stale edge remains"
            exit 43
          fi

          # Do not run Soong/Make again: it would regenerate BUILD_NINJA and undo
          # the surgical repair. Execute the exact combined graph already produced.
          NINJA="prebuilts/build-tools/linux-x86/bin/ninja"
          test -x "$NINJA"

          echo "=== Repair legacy TWRP tzdata copy source ==="
          TZ_SRC="system/timezone/output_data/iana/tzdata"
          test -s "$TZ_SRC"
          echo "tzdata_source=$TZ_SRC size=$(stat -c%s "$TZ_SRC")"

          python3 - "$BUILD_NINJA" "$TZ_SRC" <<'PYTZ'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          src = sys.argv[2]
          data = p.read_text(errors="surrogateescape")

          old = "out/target/product/rothko/system/usr/share/zoneinfo/tzdata"
          lines = data.splitlines(keepends=True)
          hits = 0
          out = []

          for line in lines:
              # Restrict the rewrite to the legacy tzdata_twrp rule/command.
              if "tzdata_twrp" in line and old in line:
                  n = line.count(old)
                  line = line.replace(old, src)
                  hits += n
              out.append(line)

          print(f"tzdata_twrp_source_rewrites={hits}")
          if hits < 1:
              raise SystemExit("ERROR: no legacy tzdata source found inside tzdata_twrp rule")

          patched = "".join(out)
          relevant = [x for x in patched.splitlines() if "tzdata_twrp" in x]
          stale = sum(x.count(old) for x in relevant)
          real = sum(x.count(src) for x in relevant)
          print(f"tzdata_twrp_stale_after={stale}")
          print(f"tzdata_twrp_real_source_refs_after={real}")
          if stale != 0:
              raise SystemExit("ERROR: stale installed tzdata path remains in tzdata_twrp rule")
          if real < 1:
              raise SystemExit("ERROR: canonical tzdata source not present in tzdata_twrp rule")
          p.write_text(patched, errors="surrogateescape")
          PYTZ

          echo "=== Starting patched Ninja graph: $COMBINED ==="
          export OUT_DIR=out
          echo "direct_ninja_OUT_DIR=$OUT_DIR"
          "$NINJA" \
            -d keepdepfile \
            -d keeprsp \
            -j1 \
            -f "$COMBINED" \
            -o usesphonyoutputs=yes \
            -w dupbuild=err \
            -w missingdepfile=err \
            vendorbootimage

      - name: Collect
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for f in build.log source-module-patches.txt generated-apc-files.txt generated-apc-new-files.txt generated-patch-counts.txt generated-ndk-platform-edges.txt ninja-entrypoint.txt; do
            cp "$GITHUB_WORKSPACE/$f" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          done
          free -h > "$GITHUB_WORKSPACE/artifacts/memory.txt"
          swapon --show > "$GITHUB_WORKSPACE/artifacts/swap.txt" || true
          df -h > "$GITHUB_WORKSPACE/artifacts/disk.txt"
          {
            echo "source_cache_hit=${{ steps.source-cache.outputs.cache-hit }}"
            echo "ccache_cache_hit=${{ steps.ccache-cache.outputs.cache-hit }}"
          } > "$GITHUB_WORKSPACE/artifacts/cache-restore.txt"
          CCACHE_DIR="$HOME/.cache/ccache" ccache -s > "$GITHUB_WORKSPACE/artifacts/ccache-stats.txt" 2>&1 || true
          echo "Direct Ninja exports OUT_DIR=out" > "$GITHUB_WORKSPACE/artifacts/direct-ninja-env.txt"

          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/rothko"
          if [ -f "$OUT/vendor_boot.img" ]; then
            cp "$OUT/vendor_boot.img" "$GITHUB_WORKSPACE/artifacts/"
            sha256sum "$OUT/vendor_boot.img" > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS.txt"
            SIZE=$(stat -c%s "$OUT/vendor_boot.img")
            {
              echo "vendor_boot_size=$SIZE"
              echo "partition_limit=67108864"
              [ "$SIZE" -le 67108864 ] && echo "size_check=PASS" || echo "size_check=FAIL"
            } > "$GITHUB_WORKSPACE/artifacts/vendor_boot-size-check.txt"
          fi
          find "$OUT" -maxdepth 4 -type f \( -name 'vendor_boot.img' -o -name '*ramdisk*' -o -name '*.cpio' -o -name '*.lz4' \) -print > "$GITHUB_WORKSPACE/artifacts/output-files.txt" 2>/dev/null || true

      - name: Free build output before cache save
        if: always()
        run: |
          echo "Disk before out cleanup:"
          df -h /
          rm -rf "$GITHUB_WORKSPACE/twrp/out"
          echo "Disk after out cleanup:"
          df -h /

      - name: Save compiler cache even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: rothko-twrp14.1-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rothko-twrp-build-v16
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
